name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t user-service ./user-service
          docker build -t product-service ./product-service
          docker build -t order-service ./order-service

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: user-service
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Update GitOps manifest
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/jacinth-emril/devops-gitops-manifests.git

          cd devops-gitops-manifests

          sed -i "s|image: .*user-service:.*|image: 554608989879.dkr.ecr.ap-south-1.amazonaws.com/user-service:latest|" user-service/deployment.yaml

          sed -i "s|image: .*product-service:.*|image: 554608989879.dkr.ecr.ap-south-1.amazonaws.com/product-service:latest|" product-service/deployment.yaml

          sed -i "s|image: .*order-service:.*|image: 554608989879.dkr.ecr.ap-south-1.amazonaws.com/order-service:latest|" order-service/deployment.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update application images" || echo "No changes to commit"

          git push
